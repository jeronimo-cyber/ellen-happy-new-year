<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelukkig Nieuwjaar 2026!</title>
   <style>
    body {
        margin: 0;
        padding: 20px; /* Ruimte rond randen op mobiel */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        min-height: 100vh; /* Minimaal viewport hoogte */
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* Start bovenaan ipv center */
        align-items: center;
        color: white;
        text-align: center;
        overflow-x: hidden; /* Voorkom horizontale scroll */
    }
    h1 {
        font-size: clamp(2rem, 8vw, 3.5rem); /* Responsive font size */
        margin: 0.2em 0 0.1em 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        animation: popIn 1s ease-out;
    }
    p {
        font-size: clamp(1.2rem, 5vw, 1.8rem);/* Responsive */
        max-width: 90vw; /* Max breedte viewport */
        line-height: 1.4;
        margin: 0.5em 0;
        animation: fadeIn 2s ease-out;
    }
    .year {
        font-size: clamp(3rem, 12vw, 6rem);
        font-weight: bold;
        color: #ffd700;
        text-shadow: 0 0 20px #ffd700;
        display: block;
        margin: 0.2em 0;
    }
    /* Rest van animaties ongewijzigd */
    @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    #confetti {
        position: fixed; /* Fixed ipv absolute voor betere mobiel support */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1; /* Achter content */
    }
</style>
</head>

<audio id="bg-music" src="taylor-swift-inspired-synthwave-pop-445163.mp3" loop></audio>

<button onclick="document.getElementById('bg-music').play()" 
        style="margin-top:20px;padding:10px 20px;font-size:1rem;border:none;
               border-radius:20px;background:#ffd700;color:#b21f1f;cursor:pointer;">
    Muziek aan
</button>


<body>
    <canvas id="confetti"></canvas>
    
    <h1>Gelukkig Nieuwjaar!</h1>
    <span class="year">2026</span>
    <p>Allerliefste Ellen!!<br><br><br><br> Beste wensen voor een fantastisch, gezond en succesvol jaar. <br><br><br>Nog een duwtje en je bent afgestudeerd.<br><br><br>You go go go Girl!!! :-)</p>

    <script>
        // Simpel confetti script
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#ffd700', '#ff0000', '#ffffff', '#00ff00', '#0000ff'];

        for(let i=0; i<100; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 6 + 2,
                d: Math.random() * 100, // density
                c: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 2,
                vy: Math.random() * 2 + 1
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            pieces.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.c;
                ctx.fill();
                p.y += p.vy;
                p.x += Math.sin(p.d) * 0.5; // sway
                p.d += 0.05;
                if(p.y > canvas.height) p.y = -10;
            });
            requestAnimationFrame(draw);
        }
        draw();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
